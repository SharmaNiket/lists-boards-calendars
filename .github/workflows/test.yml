name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.x, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Check every file parses
        run: for f in server/*.js shared/*.js public/js/*.js scripts/*.js; do node --check "$f"; done
      - name: Run the tests
        run: npm test
      - name: Start the server and load the page
        run: |
          LB_DATA="$RUNNER_TEMP/ci.db" PORT=8080 npm start &
          for i in $(seq 1 20); do curl -fs http://localhost:8080/api/sync > /dev/null && break; sleep 0.5; done
          curl -fs http://localhost:8080/ | grep -q '<div id="root">'
          curl -fs http://localhost:8080/api/sync | grep -q '"domains"'
