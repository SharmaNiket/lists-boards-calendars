name: Bug report
description: Something does not work the way it should.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Please check the [open issues](../issues) first in case it is already known.
        For a security problem, do not use this form: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
      placeholder: |
        I dragged a card from Backlog to To-Do.
        I expected the deadline to be set to Sunday.
        Instead, nothing changed.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Ideally starting from `npm run demo`, so the steps work on anyone's machine.
      placeholder: |
        1. Run npm run demo
        2. Open the Projects domain
        3. ...
    validations:
      required: true
  - type: textarea
    id: screens
    attributes:
      label: Screenshots or errors
      description: A screenshot, and anything in the browser console (F12) or the server's terminal.
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you are running. `git log -1 --oneline` shows it.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does the server run?
      options:
        - Windows
        - macOS
        - Linux
        - Raspberry Pi
        - Other
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node version
      description: "`node -v`"
  - type: input
    id: browser
    attributes:
      label: Browser and device
      placeholder: Chrome 131 on Windows 11, Safari on iPhone
